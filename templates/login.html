{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Welcome back</h1>
  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label>Username or email<input name="identifier" required autocomplete="username"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button type="submit">Log in</button>
  </form>
  <hr>

  <h2>Didn't receive your verification email?</h2>
  <form method="post" action="{{ url_for('resend_verification') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label>
      Email address
      <input type="email" name="email" required autocomplete="email">
    </label>
    <button type="submit">Resend verification email</button>
  </form>
  <p>New here? <a href="{{ url_for('register') }}">Create an account</a>.</p>
</section>
{% endblock %}
